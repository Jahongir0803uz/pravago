name: pravago
description: "Haydovchilik imtihoniga tayyorlanish uchun test ilovasi."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  iconsax: ^0.0.8
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0
  go_router: ^17.2.3
  supabase_flutter: ^2.17.2
  loading_indicator: ^4.0.0
  get_it: ^9.2.1
  shared_preferences: ^2.5.5
  flutter_screenutil: ^5.9.3
  intl: ^0.20.3
  logger: ^2.7.0
  url_launcher: ^6.3.2
  get_storage: ^2.1.1
  image_picker: ^1.2.2
  pinput: ^6.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/logos/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Thin.ttf
          weight: 100
        - asset: assets/fonts/Poppins-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Poppins-Black.ttf
          weight: 900